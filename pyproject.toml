[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dovod-procedural-ai"
version = "0.1.0"
description = "DOVOD: decision-oriented verification of observations and procedural dependencies under uncertainty."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Alexander D. Lebedev"},
  {name = "Mikhail D. Lebedev"},
  {name = "Yuri V. Trofimov"},
  {name = "Alexey N. Averkin"},
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
