name: Q1 AMLGym smoke validation

on:
  push:
    branches:
      - 'q1/full-rebuild-20260905'
    paths:
      - '.github/workflows/q1-amlgym-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  amlgym-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: research/q1_2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-amlgym.txt
      - name: Run frozen AMLGym smoke cell
        run: python benchmarks/run_amlgym_matrix.py --domains blocksworld --algorithms SAM --trace-budgets 3 --timeout-per-case 600 --fail-on-case-failure --output-dir artifacts/amlgym-smoke --summary results/paper_a_amlgym_smoke.json
      - name: Emit AMLGym smoke result
        run: cat results/paper_a_amlgym_smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: q1-amlgym-smoke
          path: |
            research/q1_2026/results/paper_a_amlgym_smoke.json
            research/q1_2026/artifacts/amlgym-smoke/*.json
          if-no-files-found: error
