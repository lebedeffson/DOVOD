name: Q1 Assembly101 ordering audit

on:
  workflow_dispatch:
  push:
    branches:
      - 'q1/full-rebuild-20260905'
    paths:
      - '.github/workflows/q1-assembly101-ordering-audit.yml'
      - 'research/q1_2026/configs/assembly101_ordering_audit_contract.json'
      - 'research/q1_2026/benchmarks/run_paper_a_assembly101_ordering_audit.py'
      - 'research/q1_2026/tests/test_assembly101_ordering_audit.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Assembly101 mistake annotations
        uses: actions/checkout@v4
        with:
          repository: assembly-101/assembly101-mistake-detection
          ref: 6f3a953267ffb86cdeabf6751af05a75a011a4f8
          path: external/assembly101-mistake-detection
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Test audit semantics
        working-directory: research/q1_2026
        run: python -m pytest -q tests/test_assembly101_ordering_audit.py
      - name: Run frozen held-out ordering audit
        id: audit
        shell: bash
        run: |
          set +e
          python research/q1_2026/benchmarks/run_paper_a_assembly101_ordering_audit.py \
            --annotations-root external/assembly101-mistake-detection/annots \
            --contract research/q1_2026/configs/assembly101_ordering_audit_contract.json \
            --output research/q1_2026/results/paper_a_assembly101_ordering_audit_v5.json \
            > assembly101-audit.log 2>&1
          code=$?
          cat assembly101-audit.log
          diag=$(tail -n 1 assembly101-audit.log | tr -cs 'A-Za-z0-9._-' '_' | cut -c1-120)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "diag=${diag:-no_message}" >> "$GITHUB_OUTPUT"
      - name: Upload failure diagnostic
        if: steps.audit.outputs.code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: assembly101-error-${{ steps.audit.outputs.code }}-${{ steps.audit.outputs.diag }}
          path: assembly101-audit.log
          if-no-files-found: error
      - name: Build compact evidence receipt
        id: receipt
        if: steps.audit.outputs.code == '0'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          p = 'research/q1_2026/results/paper_a_assembly101_ordering_audit_v5.json'
          d = json.load(open(p, encoding='utf-8'))
          t = f'{d["primary_threshold"]:.2f}'
          primary = d['primary_sequence_split']['thresholds']
          toy = d['robustness_toy_group_split']['thresholds']
          def compact(row):
              return {
                  'candidate_relations': row['candidate_relations'],
                  'correct_eligible': row['correct_eligible'],
                  'correct_violations': row['correct_violations'],
                  'order_mistake_eligible': row['order_mistake_eligible'],
                  'order_mistake_violations': row['order_mistake_violations'],
                  'refuted_relations': row['relations_refuted_by_heldout_correct_behavior],
              }
          receipt = {
              'sequences': d['sequence_count'],
              'events': d['event_count'],
              'primary_threshold': t,
              'primary': {key: compact(primary[key]) for key in sorted(primary)},
              'toy_group': {key: compact(toy[key]) for key in sorted(toy)},
          }
          def tagpart(prefix, key, row):
              return (
                  f"{prefix}{key.replace('.', '')}-r{row['candidate_relations']}"
                  f"-c{row['correct_violations']}of{row['correct_eligible']}"
                  f"-o{row['order_mistake_violations']}of{row['order_mistake_eligible']}"
                  f"-x{row['refuted_relations']}"
              )
          parts = [f"seq{d['sequence_count']}-ev{d['event_count']}"]
          parts += [tagpart('p', key, primary[key]) for key in sorted(primary)]
          parts += [tagpart('t', t, toy[t])]
          tag = '_'.join(parts)
          print('ASSEMBLY101_V5_RESULT=' + json.dumps(receipt, sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'tag={tag}\n')
          PY
      - name: Upload audit evidence
        if: steps.audit.outputs.code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: paper-a-assembly101-v5-${{ steps.receipt.outputs.tag }}
          path: research/q1_2026/results/paper_a_assembly101_ordering_audit_v5.json
          if-no-files-found: error
      - name: Fail on audit execution error
        if: steps.audit.outputs.code != '0'
        run: exit 1
