name: Q1 AMLGym DOVOD repair smoke

on:
  push:
    branches:
      - q1/full-rebuild-20260905
    paths:
      - '.github/workflows/q1-amlgym-repair-smoke.yml'
      - 'research/q1_2026/benchmarks/run_amlgym_case.py'
      - 'research/q1_2026/benchmarks/run_amlgym_matrix.py'
      - 'research/q1_2026/paper_a/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: research/q1_2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install core and AMLGym
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-amlgym.txt
      - name: Run Blocksworld 4-learner x 2-budget repair matrix
        run: >-
          python benchmarks/run_amlgym_matrix.py
          --domains blocksworld
          --algorithms SAM OffLAM NOLAM ROSAME
          --trace-budgets 3 10
          --timeout-per-case 900
          --output-dir artifacts/amlgym-repair-smoke
          --summary results/paper_a_amlgym_repair_smoke.json
          --fail-on-case-failure
      - name: Emit summary and case deltas
        if: always()
        run: |
          if [ -f results/paper_a_amlgym_repair_smoke.json ]; then
            python - <<'PY'
          import json
          d=json.load(open('results/paper_a_amlgym_repair_smoke.json'))
          print({k:v for k,v in d.items() if k!='cases'})
          for c in d.get('cases',[]):
              dec=c.get('decision')
              if dec:
                  t=dec['test']
                  print(c['algorithm'],c['trace_budget'],'base',t['base']['risk'],'dovod',t['dovod']['risk'],'delta',t['base']['risk']-t['dovod']['risk'],'pred_error',c.get('predictive_bridge_error'))
              else:
                  print(c.get('algorithm'),c.get('trace_budget'),'NO_DECISION',c.get('predictive_bridge_error'),c.get('error'))
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q1-amlgym-repair-smoke
          path: |
            research/q1_2026/results/paper_a_amlgym_repair_smoke.json
            research/q1_2026/artifacts/amlgym-repair-smoke/*.json
          if-no-files-found: warn
