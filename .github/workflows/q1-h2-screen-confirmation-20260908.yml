name: Q1 h2 screen confirmation 2026-09-08

on:
  push:
    branches:
      - 'q1/practical-strengthening-20260908'
    paths:
      - '.github/workflows/q1-h2-screen-confirmation-20260908.yml'
      - 'research/q1_2026/benchmarks/run_paper_b_h2_screen_confirmation.py'
      - 'research/q1_2026/tests/test_paper_b_h2_screen_confirmation.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h2-screen-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research/q1_2026
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/q1_2026/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Test h2 screen helper
        run: python -m pytest -q tests/test_paper_b_h2_screen_confirmation.py tests/test_core.py
      - name: Run h2 screen confirmation
        run: python benchmarks/run_paper_b_h2_screen_confirmation.py
      - uses: actions/upload-artifact@v4
        with:
          name: q1-h2-screen-confirmation-20260908
          path: research/q1_2026/results/paper_b_h2_screen_confirmation.json
          if-no-files-found: error
