name: Q1 research core validation

on:
  workflow_dispatch:
  push:
    branches:
      - 'q1/**'
    paths:
      - 'research/q1_2026/**'
      - '.github/workflows/q1-research.yml'

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: research/q1_2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/q1_2026/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Run complete local two-paper release
        run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: q1-core-results
          path: research/q1_2026/results/*.json
          if-no-files-found: error

  bluebirds:
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research/q1_2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/q1_2026/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Run frozen external source-calibration validation
        run: make bluebirds
      - name: Run external split/selection robustness diagnostic
        run: python benchmarks/run_paper_b_bluebirds_robustness.py
      - uses: actions/upload-artifact@v4
        with:
          name: q1-bluebirds-external
          path: research/q1_2026/results/paper_b_bluebirds*.json
          if-no-files-found: error
