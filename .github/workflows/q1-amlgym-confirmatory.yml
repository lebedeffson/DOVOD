name: Q1 AMLGym confirmatory v4

on:
  workflow_dispatch:
  push:
    branches:
      - 'q1/full-rebuild-20260905'
    paths:
      - '.github/workflows/q1-amlgym-confirmatory.yml'
      - 'research/q1_2026/configs/amlgym_q1_contract.json'
      - 'research/q1_2026/external_evidence/**'
      - 'research/q1_2026/paper_a/amlgym_bridge.py'
      - 'research/q1_2026/paper_a/contextual_repair.py'
      - 'research/q1_2026/paper_a/deployment.py'
      - 'research/q1_2026/paper_a/protocol.py'
      - 'research/q1_2026/benchmarks/check_amlgym_confirmatory_protocol.py'
      - 'research/q1_2026/benchmarks/run_amlgym_confirmatory_case.py'
      - 'research/q1_2026/benchmarks/run_amlgym_confirmatory_matrix.py'
      - 'research/q1_2026/benchmarks/merge_amlgym_confirmatory_results.py'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: research/q1_2026
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            research/q1_2026/requirements.txt
            research/q1_2026/requirements-amlgym.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-amlgym.txt
      - name: Verify full local two-paper release before opening confirmatory labels
        run: make release
      - name: Verify all-domain confirmatory state protocol without opening labels
        run: python benchmarks/check_amlgym_confirmatory_protocol.py
      - name: Assert label-free protocol preflight
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('artifacts/confirmatory-protocol-preflight.json').read_text())
          assert d['all_domains_clean'] is True
          assert len(d['domains']) == 20
          assert all(row['overlap'] == 0 for row in d['domains'])
          print('protocol preflight clean for', len(d['domains']), 'domains')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: confirmatory-preflight
          path: research/q1_2026/artifacts/confirmatory-protocol-preflight.json
          if-no-files-found: error

  standard_matrix:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        algorithm: [SAM, OffLAM, NOLAM, ROSAME]
        trace_budget: [3, 10]
        exclude:
          - algorithm: ROSAME
            trace_budget: 10
    defaults:
      run:
        working-directory: research/q1_2026
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            research/q1_2026/requirements.txt
            research/q1_2026/requirements-amlgym.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-amlgym.txt
      - name: Run frozen confirmatory shard
        run: >-
          python benchmarks/run_amlgym_confirmatory_matrix.py
          --algorithms '${{ matrix.algorithm }}'
          --trace-budgets '${{ matrix.trace_budget }}'
          --timeout-per-case 900
          --output-dir 'artifacts/amlgym-confirmatory/${{ matrix.algorithm }}-n${{ matrix.trace_budget }}'
          --summary 'artifacts/amlgym-confirmatory/${{ matrix.algorithm }}-n${{ matrix.trace_budget }}-summary.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: confirmatory-${{ matrix.algorithm }}-n${{ matrix.trace_budget }}
          path: research/q1_2026/artifacts/amlgym-confirmatory/**/*.json
          if-no-files-found: error

  rosame10:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        domain:
          - barman
          - blocksworld
          - childsnack
          - depots
          - elevators
          - ferry
          - floortile
          - goldminer
          - grippers
          - matchingbw
          - miconic
          - nomystery
          - npuzzle
          - parking
          - rovers
          - satellite
          - sokoban
          - spanner
          - tpp
          - transport
    defaults:
      run:
        working-directory: research/q1_2026
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            research/q1_2026/requirements.txt
            research/q1_2026/requirements-amlgym.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-amlgym.txt
      - name: Run frozen ROSAME n10 confirmatory case with receipt
        shell: bash
        run: |
          set +e
          out='artifacts/amlgym-confirmatory/ROSAME-n10/${{ matrix.domain }}__rosame__n10.json'
          mkdir -p "$(dirname "$out")"
          timeout 900s python benchmarks/run_amlgym_confirmatory_case.py \
            --domain '${{ matrix.domain }}' \
            --algorithm ROSAME \
            --trace-budget 10 \
            --max-problems 2 \
            --max-states 12 \
            --pilot-states-per-problem 12 \
            --max-actions-per-operator 4 \
            --min-repair-samples 4 \
            --max-features 8 \
            --context-width 1 \
            --edit-penalty 0.25 \
            --false-allow-weight 1.0 \
            --false-block-weight 1.0 \
            --output "$out"
          rc=$?
          if [ ! -f "$out" ]; then
            DOMAIN='${{ matrix.domain }}' RC="$rc" OUT="$out" python - <<'PY'
          import json, os
          from pathlib import Path
          rc = int(os.environ['RC'])
          receipt = {
              'schema': 'dovod-q1-amlgym-confirmatory-case-v1',
              'domain': os.environ['DOMAIN'],
              'algorithm': 'ROSAME',
              'trace_budget': 10,
              'status': 'timeout' if rc == 124 else 'failed',
              'failure_stage': 'external_case_process',
              'error': f'process exit code {rc}; no case JSON produced',
          }
          Path(os.environ['OUT']).write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY
          fi
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: confirmatory-ROSAME-n10-${{ matrix.domain }}
          path: research/q1_2026/artifacts/amlgym-confirmatory/ROSAME-n10/${{ matrix.domain }}__rosame__n10.json
          if-no-files-found: error

  merge:
    if: always()
    needs: [preflight, standard_matrix, rosame10]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/q1_2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: confirmatory-*-n*
          path: research/q1_2026/artifacts/amlgym-confirmatory-ci
          merge-multiple: true
      - name: Merge all 160 frozen cells
        run: >-
          python benchmarks/merge_amlgym_confirmatory_results.py
          artifacts/amlgym-confirmatory-ci
          --output results/paper_a_amlgym_confirmatory_matrix.json
      - name: Emit scientific result without outcome-based CI filtering
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('results/paper_a_amlgym_confirmatory_matrix.json').read_text())
          print(json.dumps({
            'complete_execution': d['complete_execution'],
            'protocol_clean': d['protocol_clean'],
            'failed_or_timeout_count': d['failed_or_timeout_count'],
            'scientific_summary': {k:v for k,v in d['scientific_summary'].items() if k != 'rows'},
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q1-amlgym-confirmatory-matrix
          path: research/q1_2026/results/paper_a_amlgym_confirmatory_matrix.json
          if-no-files-found: error
