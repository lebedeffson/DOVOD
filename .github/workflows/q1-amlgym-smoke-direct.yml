name: Q1 AMLGym upstream smoke

on:
  push:
    branches:
      - q1/full-rebuild-20260905
    paths:
      - '.github/workflows/q1-amlgym-smoke-direct.yml'
      - 'research/q1_2026/benchmarks/run_amlgym_upstream_smoke.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: research/q1_2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install AMLGym
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-amlgym.txt
      - name: Run upstream compatibility smoke
        run: python benchmarks/run_amlgym_upstream_smoke.py
      - name: Emit result
        if: always()
        run: |
          if [ -f results/amlgym_upstream_smoke.json ]; then
            cat results/amlgym_upstream_smoke.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q1-amlgym-upstream-smoke
          path: research/q1_2026/results/amlgym_upstream_smoke.json
          if-no-files-found: warn
