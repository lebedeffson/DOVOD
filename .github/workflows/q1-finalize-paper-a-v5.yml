name: Q1 finalize Paper A V5 manuscript

on:
  push:
    branches:
      - 'q1/full-rebuild-20260905'
    paths:
      - '.github/workflows/q1-finalize-paper-a-v5.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download frozen V5 receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/dovod-v5/simple /tmp/dovod-v5/assembly
          gh run download 34137791383 -n simple-baselines-merged -D /tmp/dovod-v5/simple
          gh run download 34139277922 -n paper-a-assembly101-v5-seq328-ev3964-rel18-ce37-cv8-oe5-ov2-ref5 -D /tmp/dovod-v5/assembly
      - name: Extract and run the already-reviewed manuscript materializer
        run: |
          awk 'BEGIN{p=0} /python - <<'\''PY'\''/{p=1;next} p && /^          PY$/{exit} p {sub(/^          /,""); print}' .github/workflows/q1-export-paper-a.yml > /tmp/finalize_paper_a_v5.py
          python -m py_compile /tmp/finalize_paper_a_v5.py
          python /tmp/finalize_paper_a_v5.py
      - name: Validate manuscript and receipts
        run: |
          python -m json.tool research/q1_2026/results/paper_a_amlgym_simple_baselines_v5.json >/dev/null
          python -m json.tool research/q1_2026/results/paper_a_assembly101_ordering_audit_v5.json >/dev/null
          grep -q '### 9.6 Post-confirmatory simple-baseline panel' research/q1_2026/papers/PAPER_A_DRAFT.md
          grep -q '### 10.2 Assembly101 held-out ordering audit' research/q1_2026/papers/PAPER_A_DRAFT.md
          grep -q '5 of 18 train relations' research/q1_2026/papers/PAPER_A_DRAFT.md
          git diff --check
      - name: Commit final manuscript and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/q1-export-paper-a.yml .github/workflows/q1-finalize-paper-a-v5.yml
          git add research/q1_2026/papers/PAPER_A_DRAFT.md \
                  research/q1_2026/docs/PAPER_A_V5_EVIDENCE.md \
                  research/q1_2026/results/paper_a_amlgym_simple_baselines_v5.json \
                  research/q1_2026/results/paper_a_assembly101_ordering_audit_v5.json
          git diff --cached --check
          git commit -m 'Finalize Paper A V5 manuscript and evidence'
          git push origin HEAD:q1/full-rebuild-20260905
