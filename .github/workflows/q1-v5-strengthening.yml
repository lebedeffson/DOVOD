name: Q1 V5 strengthening experiments

on:
  workflow_dispatch:
  push:
    branches:
      - 'q1/v5-experimental-strengthening-20260907'
    paths:
      - '.github/workflows/q1-v5-strengthening.yml'
      - 'research/q1_2026/benchmarks/run_paper_a_multiaction16.py'
      - 'research/q1_2026/benchmarks/run_paper_a_review_queue_sensitivity.py'
      - 'research/q1_2026/benchmarks/run_paper_b_noise_h10.py'
      - 'research/q1_2026/benchmarks/run_paper_b_assembly101_acquisition.py'
      - 'research/q1_2026/tests/test_paper_a_multiaction16.py'
      - 'research/q1_2026/tests/test_paper_b_assembly101_adapter.py'
      - 'research/q1_2026/tests/test_simple_baselines.py'
      - 'research/q1_2026/paper_a/**'
      - 'research/q1_2026/paper_b/**'

permissions:
  contents: read

jobs:
  core_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/q1_2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/q1_2026/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: >-
          python -m pytest -q
          tests/test_core.py
          tests/test_deployment_protocol.py
          tests/test_paper_a_multiaction16.py
          tests/test_paper_b_assembly101_adapter.py
          tests/test_simple_baselines.py
      - run: >-
          python -m py_compile
          paper_a/simple_baselines.py
          benchmarks/run_paper_a_multiaction16.py
          benchmarks/run_paper_a_review_queue_sensitivity.py
          benchmarks/run_paper_b_noise_h10.py
          benchmarks/run_paper_b_assembly101_acquisition.py
          benchmarks/run_amlgym_v5_baselines_case.py
          benchmarks/merge_amlgym_v5_baselines.py

  paper_a_multiaction16:
    needs: core_tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: research/q1_2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/q1_2026/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Run 16-bit two-action controlled benchmark
        run: python benchmarks/run_paper_a_multiaction16.py
      - name: Run audit review-time sensitivity
        run: python benchmarks/run_paper_a_review_queue_sensitivity.py
      - uses: actions/upload-artifact@v4
        with:
          name: paper-a-v5-strengthening
          path: |
            research/q1_2026/results/paper_a_multiaction16.json
            research/q1_2026/results/paper_a_review_queue_sensitivity.json
          if-no-files-found: error

  paper_b_noise_h10:
    needs: core_tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: research/q1_2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/q1_2026/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Run controlled noisy-observation and h=10 POMCP stress
        run: python benchmarks/run_paper_b_noise_h10.py
      - uses: actions/upload-artifact@v4
        with:
          name: paper-b-noise-h10
          path: research/q1_2026/results/paper_b_noise_h10.json
          if-no-files-found: error

  paper_b_assembly101:
    needs: core_tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: research/q1_2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip gdown
      - name: Download public Assembly101 fine-grained annotations
        shell: bash
        run: |
          rm -rf /tmp/assembly101-fine
          mkdir -p /tmp/assembly101-fine
          gdown --folder 'https://drive.google.com/drive/folders/1G1o9rTf1W5V4Q4ZSJfG2XAz0esmrwZ0g?usp=sharing' -O /tmp/assembly101-fine
          echo 'Downloaded files:'
          find /tmp/assembly101-fine -maxdepth 3 -type f -printf '%p\n' | sort
          train_file="$(find /tmp/assembly101-fine -type f -name train.csv | head -n 1)"
          test_file="$(find /tmp/assembly101-fine -type f -name test.csv | head -n 1)"
          test -n "$train_file"
          test -n "$test_file"
          test "$(dirname "$train_file")" = "$(dirname "$test_file")"
          echo "ASSEMBLY101_ANNOTATIONS_DIR=$(dirname "$train_file")" >> "$GITHUB_ENV"
      - name: Run third-dataset acquisition evaluation
        run: >-
          python benchmarks/run_paper_b_assembly101_acquisition.py
          --annotations-dir "$ASSEMBLY101_ANNOTATIONS_DIR"
          --min-train-count 5
          --output results/paper_b_assembly101_acquisition.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-b-assembly101-acquisition
          path: research/q1_2026/results/paper_b_assembly101_acquisition.json
          if-no-files-found: error
