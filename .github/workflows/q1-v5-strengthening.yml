name: Q1 V5 strengthening experiments

on:
  workflow_dispatch:
  push:
    branches:
      - 'q1/v5-experimental-strengthening-20260907'
    paths:
      - '.github/workflows/q1-v5-strengthening.yml'
      - 'research/q1_2026/benchmarks/run_paper_a_multiaction16.py'
      - 'research/q1_2026/benchmarks/run_paper_b_noise_h10.py'
      - 'research/q1_2026/tests/test_paper_a_multiaction16.py'
      - 'research/q1_2026/paper_a/**'
      - 'research/q1_2026/paper_b/**'

permissions:
  contents: read

jobs:
  core_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/q1_2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/q1_2026/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_core.py tests/test_deployment_protocol.py tests/test_paper_a_multiaction16.py
      - run: python -m py_compile benchmarks/run_paper_a_multiaction16.py benchmarks/run_paper_b_noise_h10.py

  paper_a_multiaction16:
    needs: core_tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: research/q1_2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/q1_2026/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Run 16-bit two-action controlled benchmark
        run: python benchmarks/run_paper_a_multiaction16.py
      - uses: actions/upload-artifact@v4
        with:
          name: paper-a-multiaction16
          path: research/q1_2026/results/paper_a_multiaction16.json
          if-no-files-found: error

  paper_b_noise_h10:
    needs: core_tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: research/q1_2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/q1_2026/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Run controlled noisy-observation and h=10 POMCP stress
        run: python benchmarks/run_paper_b_noise_h10.py
      - uses: actions/upload-artifact@v4
        with:
          name: paper-b-noise-h10
          path: research/q1_2026/results/paper_b_noise_h10.json
          if-no-files-found: error
