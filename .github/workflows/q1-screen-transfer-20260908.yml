name: Q1 screen transfer 2026-09-08

on:
  push:
    branches:
      - 'q1/practical-strengthening-20260908'
    paths:
      - '.github/workflows/q1-screen-transfer-20260908.yml'
      - 'research/q1_2026/benchmarks/run_paper_b_screen_transfer.py'
      - 'research/q1_2026/tests/test_paper_b_screen_transfer.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research/q1_2026
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/q1_2026/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Test transfer helpers
        run: python -m pytest -q tests/test_paper_b_screen_transfer.py tests/test_paper_b_screened_exact.py tests/test_core.py
      - name: Run source-cost transfer benchmark
        run: python benchmarks/run_paper_b_screen_transfer.py
      - uses: actions/upload-artifact@v4
        with:
          name: q1-screen-transfer-20260908
          path: research/q1_2026/results/paper_b_screen_transfer.json
          if-no-files-found: error
