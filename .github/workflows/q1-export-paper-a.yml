name: Q1 finalize Paper A V5

on:
  push:
    branches:
      - 'q1/full-rebuild-20260905'
    paths:
      - '.github/workflows/q1-export-paper-a.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download frozen V5 receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/dovod-v5/simple /tmp/dovod-v5/assembly
          gh run download 34137791383 -n simple-baselines-merged -D /tmp/dovod-v5/simple
          gh run download 34139277922 -n paper-a-assembly101-v5-seq328-ev3964-ce37-cv8-oe5-ov2-ref5 -D /tmp/dovod-v5/assembly || \
            gh run download 34139277922 -D /tmp/dovod-v5/assembly
      - name: Materialize V5 manuscript and tracked evidence
        run: |
          python - <<'PY'
          from pathlib import Path
