          s = paper.read_text()

          old_abstract = s.split('\n')[3]
          new_abstract = """Action models learned from procedural demonstrations can inherit ordering regularities that are predictive of observed behavior without being justified as hard authorization conditions. Treating every recurrent predecessor as mandatory can false-block valid actions, whereas global deletion of suspicious preconditions can create false allows. We study a downstream, learner-agnostic repair problem: which learned restrictions should remain in the authorization surface, where should local exceptions be admitted, and where are additional local guards needed? Positive procedural traces alone do not identify mechanical necessity. For a finite candidate prerequisite family, minimum empirical decision-equivalent prerequisite selection reduces to Minimum Hitting Set and is NP-hard. We introduce a finite vocabulary of contextual prerequisite exceptions and guards and optimize exact or weighted-soft mixed-integer objectives over authorization decisions. The repair changes applicability decisions only; learned effects remain untouched. In a controlled eight-bit benchmark, the exact solver recovers three planted local edits, obtains zero complete-support risk versus 0.125 for both the upstream rule and the best global-deletion baseline, and makes 0 errors on an independent 4,096-decision holdout, giving a one-sided exact 95% risk bound of 7.31e-4. With 5% label corruption and 640 observations, mean complete-support risk is 0.00156 and maximum risk is 0.00781. A frozen AMLGym 1.0.11 confirmatory protocol over 20 IPC-style domains, four learner families, and two trace budgets retains all 160 prespecified cells: 75 contain usable held-out decisions, with 7 improvements, 68 ties, and 0 degradations relative to upstream applicability; the prespecified domain comparison is 4 wins, 6 ties, and 0 losses (two-sided sign-test p=0.125), so we do not claim broad learner-wide superiority. A post-confirmatory engineering drill-down on the four domains with positive frozen domain means then exposes the mechanism without altering the confirmatory claim: across 32 cells, 216 operator decision surfaces shrink to 13 counterexample-flagged surfaces, 7 calibration-approved non-empty local repairs, and 6 unresolved/abstained surfaces; over 4,448 held-out decisions, errors fall from 90 upstream to 20 under DOVOD, while a deliberately coarse 80%-threshold global override improves 0/32 cells. Real procedural traces independently reduce a 272-relation audit queue to 71 unresolved hypotheses in MECCANO and 13 in IMPACT. On the independent Assembly101 mistake annotations (328 sequences, 3,964 events), 5 of 18 train relations whose predecessor frequency is at least 0.90 are contradicted by held-out labeled-correct behavior; among covered held-out events, relation violations occur in 8/37 correct events and 2/5 explicit ordering mistakes. Thus recurrent order is neither mechanical necessity nor, by itself, a reliable mistake detector. The result is an auditable selective-repair workflow, not a claim of causal prerequisite discovery or autonomous safety authorization."""
          if not old_abstract.startswith('Action models learned'):
