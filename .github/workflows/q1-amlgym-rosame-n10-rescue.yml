name: Q1 AMLGym ROSAME n10 rescue

on:
  push:
    branches:
      - q1/full-rebuild-20260905
    paths:
      - '.github/workflows/q1-amlgym-rosame-n10-rescue.yml'

permissions:
  contents: read

jobs:
  chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - chunk: 0
            domains: 'barman blocksworld childsnack depots elevators'
          - chunk: 1
            domains: 'ferry floortile goldminer grippers matchingbw'
          - chunk: 2
            domains: 'miconic nomystery npuzzle parking rovers'
          - chunk: 3
            domains: 'satellite sokoban spanner tpp transport'
    defaults:
      run:
        working-directory: research/q1_2026
    env:
      PYTHONPATH: .
      DOMAINS: ${{ matrix.domains }}
      CHUNK: ${{ matrix.chunk }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-amlgym.txt
      - name: Run frozen ROSAME n10 chunk
        run: >-
          python benchmarks/run_amlgym_matrix.py
          --domains ${DOMAINS}
          --algorithms ROSAME
          --trace-budgets 10
          --timeout-per-case 900
          --output-dir "artifacts/rosame-n10-rescue/chunk-${CHUNK}"
          --summary "artifacts/rosame-n10-rescue/chunk-${CHUNK}-summary.json"
      - name: Require all five case records
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('artifacts/rosame-n10-rescue')/f"chunk-{os.environ['CHUNK']}-summary.json"
          d=json.loads(p.read_text())
          if d.get('case_count') != 5:
              raise SystemExit(json.dumps(d, indent=2))
          print(json.dumps({k:d.get(k) for k in ['case_count','ok_count','decision_bridge_count','failed_or_timeout_count']}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rosame-n10-rescue-${{ matrix.chunk }}
          path: research/q1_2026/artifacts/rosame-n10-rescue/**/*.json
          if-no-files-found: error
