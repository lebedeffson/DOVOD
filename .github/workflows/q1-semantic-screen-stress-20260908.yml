name: Q1 semantic screen stress 2026-09-08

on:
  push:
    branches:
      - 'q1/practical-strengthening-20260908'
    paths:
      - '.github/workflows/q1-semantic-screen-stress-20260908.yml'
      - 'research/q1_2026/benchmarks/run_paper_b_semantic_root_screen_stress.py'
      - 'research/q1_2026/tests/test_paper_b_semantic_root_screen_stress.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-screen-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research/q1_2026
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/q1_2026/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Test stress helpers
        run: python -m pytest -q tests/test_paper_b_semantic_root_screen_stress.py tests/test_paper_b_screened_exact.py tests/test_core.py
      - name: Run semantic-root query-screen stress
        run: python benchmarks/run_paper_b_semantic_root_screen_stress.py
      - uses: actions/upload-artifact@v4
        with:
          name: q1-semantic-screen-stress-20260908
          path: research/q1_2026/results/paper_b_semantic_root_screen_stress.json
          if-no-files-found: error
