name: Q1 pomdp_py exact cross-check

# Independent external-library validation of the finite orientation case.
# Triggered validation: 2026-09-06.
on:
  push:
    branches:
      - q1/full-rebuild-20260905
    paths:
      - '.github/workflows/q1-pomdp-py-crosscheck.yml'
      - 'research/q1_2026/benchmarks/run_paper_b_pomdp_py_crosscheck.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research/q1_2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent POMDP library
        run: python -m pip install --upgrade pip && python -m pip install 'pomdp-py==1.3.5.1'
      - name: Run exact external-library cross-check
        run: python benchmarks/run_paper_b_pomdp_py_crosscheck.py
      - name: Emit result
        if: always()
        run: |
          if [ -f results/paper_b_pomdp_py_crosscheck.json ]; then
            cat results/paper_b_pomdp_py_crosscheck.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q1-pomdp-py-crosscheck
          path: research/q1_2026/results/paper_b_pomdp_py_crosscheck.json
          if-no-files-found: warn
