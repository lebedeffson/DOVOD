name: Q1 AMLGym full matrix

on:
  push:
    branches:
      - 'q1/full-rebuild-20260905'
    paths:
      - '.github/workflows/q1-amlgym-full.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        algorithm: [SAM, OffLAM, NOLAM, ROSAME]
        trace_budget: [3, 10]
    defaults:
      run:
        working-directory: research/q1_2026
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-amlgym.txt
      - name: Run full frozen shard
        run: >-
          python benchmarks/run_amlgym_matrix.py
          --algorithms '${{ matrix.algorithm }}'
          --trace-budgets '${{ matrix.trace_budget }}'
          --timeout-per-case 900
          --output-dir 'artifacts/amlgym-full/${{ matrix.algorithm }}-n${{ matrix.trace_budget }}'
          --summary 'artifacts/amlgym-full/${{ matrix.algorithm }}-n${{ matrix.trace_budget }}-summary.json'
      - name: Reject vacuous green shards
        env:
          ALGORITHM: ${{ matrix.algorithm }}
          TRACE_BUDGET: ${{ matrix.trace_budget }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('artifacts/amlgym-full') / f"{os.environ['ALGORITHM']}-n{os.environ['TRACE_BUDGET']}-summary.json"
          d = json.loads(p.read_text())
          if d.get('case_count') != 20:
              raise SystemExit(f"expected 20 domain cells, got {d.get('case_count')}")
          if d.get('ok_count', 0) <= 0:
              raise SystemExit(f"vacuous shard: ok_count={d.get('ok_count')}")
          if d.get('decision_bridge_count', 0) <= 0:
              raise SystemExit(f"no predictive decision bridge succeeded: {d.get('decision_bridge_count')}")
          print(json.dumps({k:d.get(k) for k in ['ok_count','failed_or_timeout_count','decision_bridge_count','improved_test_cases','tied_test_cases','worsened_test_cases','mean_test_risk_reduction']}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-${{ matrix.algorithm }}-n${{ matrix.trace_budget }}
          path: research/q1_2026/artifacts/amlgym-full/**/*.json
          if-no-files-found: warn
