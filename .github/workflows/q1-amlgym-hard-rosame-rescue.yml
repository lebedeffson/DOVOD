name: Q1 AMLGym hard ROSAME rescue

on:
  push:
    branches:
      - q1/full-rebuild-20260905
    paths:
      - '.github/workflows/q1-amlgym-hard-rosame-rescue.yml'

permissions:
  contents: read

jobs:
  chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - chunk: 0
            domains: 'barman blocksworld childsnack depots elevators'
          - chunk: 1
            domains: 'ferry floortile goldminer grippers matchingbw'
          - chunk: 2
            domains: 'miconic nomystery npuzzle parking rovers'
          - chunk: 3
            domains: 'satellite sokoban spanner tpp transport'
    defaults:
      run:
        working-directory: research/q1_2026
    env:
      PYTHONPATH: .
      DOMAINS: ${{ matrix.domains }}
      CHUNK: ${{ matrix.chunk }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-amlgym.txt
      - name: Run frozen hard ROSAME chunk
        run: |
          mkdir -p "artifacts/hard-rosame-rescue/chunk-${CHUNK}"
          cp benchmarks/run_amlgym_case.py /tmp/run_amlgym_hard_case.py
          sed -i 's/get_trajectories_path(args.domain, kind="learning")/get_trajectories_path(args.domain, kind="learning_hard")/' /tmp/run_amlgym_hard_case.py
          for domain in ${DOMAINS}; do
            python /tmp/run_amlgym_hard_case.py \
              --domain "$domain" \
              --algorithm ROSAME \
              --trace-budget 1 \
              --output "artifacts/hard-rosame-rescue/chunk-${CHUNK}/${domain}__ROSAME__hard_n1.json" || true
          done
      - name: Require all five case records
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('artifacts/hard-rosame-rescue')/f"chunk-{os.environ['CHUNK']}"
          rows=[]
          for p in sorted(root.glob('*.json')):
              rows.append(json.loads(p.read_text()))
          if len(rows) != 5:
              raise SystemExit(f'expected 5 retained cells, got {len(rows)}')
          ok=sum(r.get('status')=='ok' for r in rows)
          decision=sum(r.get('status')=='ok' and isinstance(r.get('decision'),dict) for r in rows)
          print(json.dumps({'case_count':len(rows),'ok_count':ok,'decision_bridge_count':decision},indent=2))
          if decision <= 0:
              raise SystemExit('vacuous hard ROSAME chunk')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hard-rosame-rescue-${{ matrix.chunk }}
          path: research/q1_2026/artifacts/hard-rosame-rescue/**/*.json
          if-no-files-found: error
