name: Q1 V5 AMLGym simple baselines

on:
  workflow_dispatch:
  push:
    branches:
      - 'q1/v5-experimental-strengthening-20260907'
    paths:
      - '.github/workflows/q1-v5-amlgym-baselines.yml'
      - 'research/q1_2026/paper_a/simple_baselines.py'
      - 'research/q1_2026/tests/test_simple_baselines.py'
      - 'research/q1_2026/benchmarks/run_amlgym_v5_baselines_case.py'
      - 'research/q1_2026/benchmarks/merge_amlgym_v5_baselines.py'
      - 'research/q1_2026/benchmarks/run_amlgym_confirmatory_case.py'
      - 'research/q1_2026/paper_a/amlgym_bridge.py'
      - 'research/q1_2026/paper_a/deployment.py'
      - 'research/q1_2026/paper_a/protocol.py'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/q1_2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/q1_2026/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_simple_baselines.py tests/test_deployment_protocol.py
      - run: python -m py_compile paper_a/simple_baselines.py benchmarks/run_amlgym_v5_baselines_case.py benchmarks/merge_amlgym_v5_baselines.py

  baseline_matrix:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        algorithm: [SAM, OffLAM, NOLAM, ROSAME]
        trace_budget: [3, 10]
    defaults:
      run:
        working-directory: research/q1_2026
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      DOVOD_CONFIRMATORY_SEED: '20260906'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            research/q1_2026/requirements.txt
            research/q1_2026/requirements-amlgym.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-amlgym.txt
      - name: Run all 20 domains for one learner/budget pair
        shell: bash
        env:
          ALGORITHM: ${{ matrix.algorithm }}
          TRACE_BUDGET: ${{ matrix.trace_budget }}
        run: |
          set -u
          domains=(barman blocksworld childsnack depots elevators ferry floortile goldminer grippers matchingbw miconic nomystery npuzzle parking rovers satellite sokoban spanner tpp transport)
          root="artifacts/amlgym-v5-baselines/${ALGORITHM}-n${TRACE_BUDGET}"
          mkdir -p "$root"
          for domain in "${domains[@]}"; do
            out="$root/${domain}__${ALGORITHM,,}__n${TRACE_BUDGET}.json"
            echo "=== $domain / $ALGORITHM / n=$TRACE_BUDGET ==="
            set +e
            timeout 900s python benchmarks/run_amlgym_v5_baselines_case.py \
              --domain "$domain" \
              --algorithm "$ALGORITHM" \
              --trace-budget "$TRACE_BUDGET" \
              --max-problems 2 \
              --max-states 12 \
              --pilot-states-per-problem 12 \
              --max-actions-per-operator 4 \
              --min-repair-samples 4 \
              --max-features 8 \
              --context-width 1 \
              --edit-penalty 0.25 \
              --false-allow-weight 1.0 \
              --false-block-weight 1.0 \
              --random-replicates 16 \
              --output "$out"
            rc=$?
            set -e
            if [ ! -f "$out" ]; then
              DOMAIN="$domain" ALGORITHM="$ALGORITHM" TRACE_BUDGET="$TRACE_BUDGET" RC="$rc" OUT="$out" python - <<'PY'
          import json, os
          from pathlib import Path
          rc = int(os.environ['RC'])
          report = {
              'schema': 'dovod-q1-amlgym-v5-baseline-case-v1',
              'status': 'timeout' if rc == 124 else 'failed',
              'domain': os.environ['DOMAIN'],
              'algorithm': os.environ['ALGORITHM'],
              'trace_budget': int(os.environ['TRACE_BUDGET']),
              'failure_stage': 'external_case_process',
              'error': f'process exit code {rc}; no case JSON produced',
          }
          Path(os.environ['OUT']).write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          PY
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-baselines-${{ matrix.algorithm }}-n${{ matrix.trace_budget }}
          path: research/q1_2026/artifacts/amlgym-v5-baselines/**/*.json
          if-no-files-found: error

  merge:
    if: always()
    needs: [unit, baseline_matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/q1_2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: v5-baselines-*
          path: research/q1_2026/artifacts/amlgym-v5-baselines-ci
          merge-multiple: true
      - name: Merge all accounted comparator cells
        run: >-
          python benchmarks/merge_amlgym_v5_baselines.py
          artifacts/amlgym-v5-baselines-ci
          --expected 160
          --output results/paper_a_amlgym_v5_baselines.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-a-amlgym-v5-baselines-merged
          path: research/q1_2026/results/paper_a_amlgym_v5_baselines.json
          if-no-files-found: error
