name: Q1 AMLGym hard ROSAME tail

on:
  push:
    branches: [q1/full-rebuild-20260905]
    paths: ['.github/workflows/q1-amlgym-hard-rosame-tail.yml']
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        domain: [satellite, sokoban, spanner, tpp, transport]
    defaults:
      run:
        working-directory: research/q1_2026
    env:
      PYTHONPATH: .
      DOMAIN: ${{ matrix.domain }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-amlgym.txt
      - name: Run frozen hard ROSAME cell
        run: |
          mkdir -p artifacts/hard-rosame-tail
          cp benchmarks/run_amlgym_case.py /tmp/run_amlgym_hard_case.py
          sed -i 's/get_trajectories_path(args.domain, kind="learning")/get_trajectories_path(args.domain, kind="learning_hard")/' /tmp/run_amlgym_hard_case.py
          python /tmp/run_amlgym_hard_case.py --domain "$DOMAIN" --algorithm ROSAME --trace-budget 1 --output "artifacts/hard-rosame-tail/${DOMAIN}__ROSAME__hard_n1.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hard-rosame-tail-${{ matrix.domain }}
          path: research/q1_2026/artifacts/hard-rosame-tail/*.json
          if-no-files-found: error
